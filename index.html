<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janier ❤️ Allison</title>

<style>
body {
  margin: 0;
  background: black;
  overflow-x: hidden;
  font-family: 'Courier New', monospace;
  color: #c77dff;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  transition: 0.8s;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 2;
  background: rgba(20, 0, 40, 0.85);
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px #a855f7;
  text-align: center;
  max-width: 700px;
  margin-top: 100px;
  transition: 0.8s;
}

#texto {
  font-size: 20px;
  line-height: 1.8;
  min-height: 200px;
  white-space: pre-wrap;
}

.cursor {
  animation: blink 1s infinite;
}
@keyframes blink { 50% {opacity:0;} }

button {
  margin-top: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #a855f7, #d946ef);
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #c77dff;
  transition: 0.3s;
  position: relative;
}

button:hover { transform: scale(1.1); }

#noBtn {
  position: absolute;
}

.hiddenImage {
  display: none;
  margin-top: 25px;
}

.hiddenImage img {
  width: 300px;
  border-radius: 15px;
  box-shadow: 0 0 25px #ff4d6d;
  transition: 0.5s;
}

.mensajeRomantico {
  position: fixed;
  top: 40%;
  font-size: 50px;
  font-weight: bold;
  text-align: center;
  color: white;
  text-shadow: 0 0 20px pink;
  animation: aparecer 1s ease forwards;
  z-index: 5;
}

@keyframes aparecer {
  from { opacity:0; transform:scale(0.5);}
  to { opacity:1; transform:scale(1);}
}

.corazon {
  position: fixed;
  color: #ff4d6d;
  animation: flotar 4s linear infinite;
}
@keyframes flotar {
  0% { transform: translateY(100vh); opacity:1;}
  100% { transform: translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="card" id="card">
  <div id="texto"></div><span class="cursor">_</span>

  <br><br>

  <button onclick="modoViaje()">Un recuerdo hermoso</button>
  <br>
  <button onclick="aceptar()">Sí, quiero</button>
  <button id="noBtn" onmouseover="huir()">No</button>

  <div class="hiddenImage" id="imagenViaje">
    <img src="https://i.postimg.cc/jq107Nyw/Whats-App-Image-2026-02-14-at-11-43-21.jpg">
  </div>

  <div class="hiddenImage" id="imagenPropuesta">
    <!-- 🔥 AQUÍ PONES TU IMAGEN DE PROPUESTA -->
    <img src="AQUI_TU_IMAGEN_DE_PROPUESTA.jpg">
  </div>
</div>

<audio id="musica" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>

/* MATRIX */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01❤JANIERALLISON";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
let colores = ["#c77dff","#ff4d6d","#00f5d4","#ffd60a","#ff85a1","#80ffdb"];
let colorActual = "#c77dff";

for (let x = 0; x < columns; x++) drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = colorActual;
  ctx.font = fontSize + "px monospace";
  for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random()*letters.length));
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if (drops[i]*fontSize > canvas.height && Math.random()>0.985)
      drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,70);

/* TEXTO */
const mensaje = `
Te encontraría. En cualquier tiempo. En cualquier lugar. Si tuviera que atravesar siglos... 
Lo haría por ti." Y si mi alma tuviera que elegir de nuevo, siempre elegiría tu mirada, tu risa, tu forma de abrazarme como si el mundo se detuviera. 
Porque no importa la época, no importa el destino, mi corazón siempre sabrá encontrarte.
`;

let i=0;
function escribir(){
  if(i<mensaje.length){
    document.getElementById("texto").innerHTML+=mensaje.charAt(i);
    i++;
    setTimeout(escribir,70);
  }
}
escribir();

/* CAMBIO DE COLOR */

function cambiarColor(){
  colorActual = colores[Math.floor(Math.random()*colores.length)];
  document.body.style.background=`linear-gradient(45deg,${colorActual},black)`;
  document.getElementById("card").style.boxShadow=`0 0 40px ${colorActual}`;
}

/* BOTONES */

function modoViaje(){
  document.getElementById("imagenViaje").style.display="block";
  document.getElementById("imagenPropuesta").style.display="none";
  cambiarColor();
  musica.play();
}

function aceptar(){
  document.getElementById("imagenPropuesta").style.display="block";
  document.getElementById("imagenViaje").style.display="none";
  cambiarColor();
  musica.play();
  explosionCorazones();
  mostrarMensaje();
}

function huir(){
  const btn=document.getElementById("noBtn");
  btn.style.top=Math.random()*80+"vh";
  btn.style.left=Math.random()*80+"vw";
}

/* EFECTOS */

function explosionCorazones(){
  for(let i=0;i<25;i++){
    const corazon=document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML="❤";
    corazon.style.left=Math.random()*100+"vw";
    corazon.style.fontSize=(Math.random()*40+20)+"px";
    corazon.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(corazon);
    setTimeout(()=>{corazon.remove();},4000);
  }
}

function mostrarMensaje(){
  const mensaje=document.createElement("div");
  mensaje.classList.add("mensajeRomantico");
  mensaje.innerHTML="";
  document.body.appendChild(mensaje);
}

</script>

</body>
</html>
