<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Destino Enlazado 💜</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- FONDO HACKER -->
  <canvas id="matrix"></canvas>

  <div class="contenedor">

    <!-- TEXTO TIPO MÁQUINA -->
    <div class="terminal">
      <p id="textoMaquina"></p>
      <span class="cursor">|</span>
    </div>

    <!-- CONTADOR -->
    <div class="contador-box">
      <div id="contador" class="contador"></div>
    </div>

    <!-- BOTONES -->
    <div class="botones">

      <button id="btnViaje" class="boton-img">
        <img src="tu-imagen-1.png" alt="">
        ¿Lista para viajar en el tiempo conmigo? 💜
      </button>

      <button id="btnDestino" class="boton-img">
        <img src="tu-imagen-2.png" alt="">
        Descubrir nuestro destino ✨
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
