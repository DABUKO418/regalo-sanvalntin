<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Amor ❤️</title>

<style>
body{
  margin:0;
  background:linear-gradient(to top,#f48ca3,#ffd6de);
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Segoe UI',sans-serif;
  color:white;
  overflow:hidden;
  text-align:center;
}

.tree-container{
  position:relative;
  width:300px;
  height:400px;
}

/* TRONCO */
.trunk{
  position:absolute;
  bottom:0;
  left:50%;
  width:18px;
  height:0;
  background:#5a2d0c;
  transform:translateX(-50%);
  border-radius:10px;
  animation:growTrunk 2s forwards ease-out;
}

@keyframes growTrunk{
  to{ height:200px; }
}

/* RAMAS */
.branch{
  position:absolute;
  width:140px;
  height:80px;
  border-bottom:6px solid #5a2d0c;
  border-radius:50%;
  transform:scaleX(0);
  animation:growBranch 1.5s forwards ease-out;
}

.branch.left{
  bottom:170px;
  left:50%;
  transform-origin:right;
  transform:translateX(-100%) rotate(-25deg) scaleX(0);
  animation-delay:2s;
}

.branch.right{
  bottom:170px;
  left:50%;
  transform-origin:left;
  transform:rotate(25deg) scaleX(0);
  animation-delay:2.5s;
}

@keyframes growBranch{
  to{
    transform:rotate(0deg) scaleX(1);
  }
}

/* CORAZONES */
.heart{
  position:absolute;
  width:22px;
  height:22px;
  background:#ff2e63;
  transform:rotate(-45deg) scale(0);
  opacity:0;
  animation:popHeart 0.8s forwards ease-out;
}

.heart::before,
.heart::after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  background:#ff2e63;
  border-radius:50%;
}

.heart::before{
  top:-11px;
  left:0;
}

.heart::after{
  left:11px;
  top:0;
}

@keyframes popHeart{
  to{
    opacity:1;
    transform:rotate(-45deg) scale(1);
  }
}

h1{
  font-size:42px;
  margin-top:20px;
}

#contador{
  margin-top:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="tree-container">

  <div class="trunk"></div>

  <div class="branch left"></div>
  <div class="branch right"></div>

  <!-- Corazones organizados -->
  <div class="heart" style="top:90px; left:130px; animation-delay:4s;"></div>
  <div class="heart" style="top:70px; left:100px; animation-delay:4.2s;"></div>
  <div class="heart" style="top:70px; left:170px; animation-delay:4.4s;"></div>
  <div class="heart" style="top:50px; left:130px; animation-delay:4.6s;"></div>
  <div class="heart" style="top:110px; left:90px; animation-delay:4.8s;"></div>
  <div class="heart" style="top:110px; left:190px; animation-delay:5s;"></div>

</div>

<h1>Nuestro Amor ❤️</h1>
<p>Eres lo mejor que me ha pasado.</p>

<div id="contador"></div>

<script>
const fechaInicio = new Date("2022-08-22T00:00:00");

function actualizarContador(){
  const ahora = new Date();
  const diferencia = ahora - fechaInicio;

  const dias = Math.floor(diferencia / (1000*60*60*24));
  const horas = Math.floor((diferencia / (1000*60*60)) % 24);
  const minutos = Math.floor((diferencia / (1000*60)) % 60);
  const segundos = Math.floor((diferencia / 1000) % 60);

  document.getElementById("contador").innerHTML =
  `Llevamos juntos ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos ❤️`;
}

setInterval(actualizarContador,1000);
actualizarContador();
</script>

</body>
</html>
