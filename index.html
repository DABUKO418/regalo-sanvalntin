<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janier ❤️ Allison</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  color: #c77dff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Fondo canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* Caja central */
.card {
  position: relative;
  z-index: 2;
  background: rgba(20, 0, 40, 0.85);
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px #a855f7;
  text-align: center;
  max-width: 600px;
}

.card h1 {
  color: #e0aaff;
  font-size: 22px;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #a855f7, #d946ef);
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #c77dff;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

/* Imagen oculta */
.hiddenImage {
  display: none;
  margin-top: 20px;
}

.hiddenImage img {
  width: 250px;
  border-radius: 15px;
  box-shadow: 0 0 20px #d946ef;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="card" id="card">
  <h1>
    class AmorEterno { <br><br>
    constructor() { <br>
    this.janier = "❤️"; <br>
    this.allison = "❤️"; <br>
    this.promesa = "Para siempre"; <br>
    } <br><br>
    async declararAmor() { <br>
    return "Janier ❤️ Allison<br><br>
    Eres mi código favorito,<br>
    mi bug más hermoso,<br>
    y mi sistema operativo del corazón 💜"; <br>
    } <br>
    }
  </h1>

  <button onclick="mostrarImagen()">Ver nuestro destino 💜</button>

  <div class="hiddenImage" id="imagen">
    <img src="https://i.postimg.cc/jq107Nyw/Whats-App-Image-2026-02-14-at-11-43-21.jpg" alt="Imagen romántica">
  </div>
</div>

<script>
// MATRIX MORADO
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01❤JANIERALLISON";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for (let x = 0; x < columns; x++) {
  drops[x] = 1;
}

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#c77dff";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 35);

// Mostrar imagen
function mostrarImagen() {
  document.getElementById("imagen").style.display = "block";
}
</script>

</body>
</html>
