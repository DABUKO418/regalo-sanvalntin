<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janier ❤️ Allison</title>

<style>
body {
  margin: 0;
  background: black;
  overflow-x: hidden;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  color: #c77dff;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  transition: 0.8s;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 2;
  background: rgba(20, 0, 40, 0.85);
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px #a855f7;
  text-align: center;
  max-width: 700px;
  margin-top: 100px;
  transition: 0.8s;
}

#texto {
  font-size: 20px;
  line-height: 1.8;
  min-height: 200px;
  white-space: pre-wrap;
}

.cursor {
  display: inline-block;
  font-weight: bold;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #a855f7, #d946ef);
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #c77dff;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

.contador {
  margin-top: 30px;
  font-size: 22px;
  letter-spacing: 2px;
}

.hiddenImage {
  display: none;
  margin-top: 30px;
}

.hiddenImage img {
  width: 300px;
  border-radius: 15px;
  box-shadow: 0 0 20px #d946ef;
  transition: 0.5s;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="card" id="card">
  <div id="texto"></div><span class="cursor">_</span>

  <div class="contador" id="contador"></div>

  <button onclick="modoAmor()">¿Lista para viajar en el tiempo conmigo? 💜</button>

  <button onclick="sanValentin()">¿Quieres ser mi San Valentín? 💘</button>

  <div class="hiddenImage" id="imagen">
    <img src="https://i.postimg.cc/jq107Nyw/Whats-App-Image-2026-02-14-at-11-43-21.jpg">
  </div>

  <div class="hiddenImage" id="imagen2">
    <!-- 🔥 CAMBIA ESTA IMAGEN POR LA QUE QUIERAS -->
    <img src="https://i.postimg.cc/3x3QzSGq/love-heart.png">
  </div>

</div>

<!-- 🎵 MÚSICA -->
<audio id="musica" loop>
  <!-- 🔥 CAMBIA "cancion.mp3" POR EL NOMBRE DE TU ARCHIVO -->
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<script>

/* ================= MATRIX ================= */

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01❤JANIERALLISON";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];

let colores = ["#c77dff","#ff4d6d","#00f5d4","#ffd60a","#ff85a1","#80ffdb"];
let colorActual = "#c77dff";

for (let x = 0; x < columns; x++) {
  drops[x] = 1;
}

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = colorActual;
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters.charAt(Math.floor(Math.random() * letters.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.985)
      drops[i] = 0;

    drops[i]++;
  }
}

setInterval(draw, 70);

/* ================= TEXTO TERMINAL ================= */

const mensaje = `
Te encontraría.
En cualquier tiempo.
En cualquier lugar.
Porque mi corazón siempre sabrá encontrarte.
`;

let i = 0;
function escribir() {
  if (i < mensaje.length) {
    document.getElementById("texto").innerHTML += mensaje.charAt(i);
    i++;
    setTimeout(escribir, 80);
  }
}
escribir();

/* ================= CONTADOR ================= */

const fechaInicio = new Date("2022-08-01T00:00:00");

function actualizarContador() {
  const ahora = new Date();
  const diferencia = ahora - fechaInicio;

  const segundos = Math.floor(diferencia / 1000) % 60;
  const minutos = Math.floor(diferencia / (1000 * 60)) % 60;
  const horas = Math.floor(diferencia / (1000 * 60 * 60)) % 24;
  const diasTotales = Math.floor(diferencia / (1000 * 60 * 60 * 24));

  const años = Math.floor(diasTotales / 365);
  const dias = diasTotales % 365;

  document.getElementById("contador").innerHTML =
    `${años} años • ${dias} días • ${horas}h ${minutos}m ${segundos}s`;
}

setInterval(actualizarContador, 1000);
actualizarContador();

/* ================= BOTONES ================= */

const musica = document.getElementById("musica");

function reproducirMusica() {
  musica.play();
}

function modoAmor() {
  reproducirMusica();
  document.getElementById("imagen").style.display = "block";
  colorActual = colores[Math.floor(Math.random()*colores.length)];
  document.body.style.background =
    `linear-gradient(45deg, ${colorActual}, black)`;
}

function sanValentin() {
  reproducirMusica();
  document.getElementById("imagen2").style.display = "block";
  colorActual = colores[Math.floor(Math.random()*colores.length)];
  document.body.style.background =
    `linear-gradient(45deg, black, ${colorActual})`;
}

</script>

</body>
</html>
