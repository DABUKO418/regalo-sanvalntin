<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Feliz San Valentín ❤️</title>

<style>
body{
  margin:0;
  background:#e89aa5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
  color:white;
  text-align:center;
}

/* CONTENEDOR */
.tree-container{
  position:relative;
  width:300px;
  height:400px;
}

/* TRONCO */
.trunk{
  position:absolute;
  bottom:0;
  left:50%;
  width:20px;
  height:0;
  background:#7b3f00;
  transform:translateX(-50%);
  border-radius:10px;
  animation:growTrunk 2s forwards;
}

@keyframes growTrunk{
  to{
    height:180px;
  }
}

/* RAMAS */
.branch{
  position:absolute;
  bottom:170px;
  width:120px;
  height:60px;
  border-bottom:6px solid #7b3f00;
  border-radius:50%;
  opacity:0;
  animation:showBranches 1s 2s forwards;
}

.branch.left{
  left:50%;
  transform:translateX(-100%) rotate(-20deg);
}

.branch.right{
  left:50%;
  transform:rotate(20deg);
}

@keyframes showBranches{
  to{ opacity:1; }
}

/* CORAZONES */
.heart{
  position:absolute;
  width:20px;
  height:20px;
  background:red;
  transform:rotate(-45deg);
  opacity:0;
  animation:appearHearts 1s forwards;
}

.heart::before,
.heart::after{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  background:red;
  border-radius:50%;
}

.heart::before{
  top:-10px;
  left:0;
}

.heart::after{
  left:10px;
  top:0;
}

@keyframes appearHearts{
  to{
    opacity:1;
    transform:rotate(-45deg) scale(1.2);
  }
}

h1{
  margin-top:20px;
  font-size:40px;
}

#contador{
  margin-top:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="tree-container">

  <div class="trunk"></div>

  <div class="branch left"></div>
  <div class="branch right"></div>

  <!-- Corazones organizados -->
  <div class="heart" style="top:60px; left:130px; animation-delay:3s;"></div>
  <div class="heart" style="top:40px; left:100px; animation-delay:3.2s;"></div>
  <div class="heart" style="top:40px; left:160px; animation-delay:3.4s;"></div>
  <div class="heart" style="top:80px; left:90px; animation-delay:3.6s;"></div>
  <div class="heart" style="top:80px; left:170px; animation-delay:3.8s;"></div>
  <div class="heart" style="top:20px; left:130px; animation-delay:4s;"></div>

</div>

<h1>¡Feliz San Valentín! ❤️</h1>
<p>Eres lo mejor que me ha pasado.</p>

<div id="contador"></div>

<script>
// CAMBIA ESTA FECHA 👇
const fechaInicio = new Date("2024-06-15");

function actualizarContador(){
  const ahora = new Date();
  const diferencia = ahora - fechaInicio;

  const dias = Math.floor(diferencia / (1000*60*60*24));
  const horas = Math.floor((diferencia / (1000*60*60)) % 24);
  const minutos = Math.floor((diferencia / (1000*60)) % 60);
  const segundos = Math.floor((diferencia / 1000) % 60);

  document.getElementById("contador").innerHTML =
  `Llevamos juntos: ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos ❤️`;
}

setInterval(actualizarContador,1000);
actualizarContador();
</script>

</body>
</html>
