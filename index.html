<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Amor 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#f6a5ff,#c084fc,#a855f7);
  overflow:hidden;
  color:white;
  text-align:center;
}

/* SVG árbol */
svg{
  width:420px;
  height:500px;
}

/* Dibujo del árbol */
path{
  fill:none;
  stroke:#4b1d00;
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  animation:drawTree 4s ease forwards;
}

@keyframes drawTree{
  to{
    stroke-dashoffset:0;
  }
}

/* Corazones */
.heart{
  fill:#ff4d88;
  opacity:0;
  transform-origin:center;
  animation:float 4s ease-in-out infinite alternate;
}

@keyframes appear{
  to{ opacity:1; }
}

@keyframes float{
  from{ transform:translateY(0px); }
  to{ transform:translateY(-8px); }
}

h1{
  font-family:'Cormorant Garamond', serif;
  font-size:52px;
  margin:10px 0 0;
}

p{
  font-family:'Montserrat', sans-serif;
  font-size:16px;
  opacity:0.9;
}

#contador{
  margin-top:15px;
  font-family:'Montserrat', sans-serif;
  font-size:18px;
}
</style>
</head>

<body>

<svg viewBox="0 0 400 500">

  <!-- TRONCO -->
  <path d="M200 480 L200 300" />

  <!-- RAMAS IZQUIERDA -->
  <path d="M200 350 C160 330, 140 300, 130 270" />
  <path d="M200 330 C150 310, 120 270, 110 240" />
  <path d="M200 310 C170 290, 150 250, 145 220" />

  <!-- RAMAS DERECHA -->
  <path d="M200 350 C240 330, 260 300, 270 270" />
  <path d="M200 330 C250 310, 280 270, 290 240" />
  <path d="M200 310 C230 290, 250 250, 255 220" />

  <!-- CORAZONES -->
  <g id="hearts"></g>

</svg>

<h1>Nuestro Amor 💜</h1>
<p>Eres lo mejor que me ha pasado.</p>
<div id="contador"></div>

<script>
/* Generar corazones organizados */
const svg = document.querySelector("svg");
const heartGroup = document.getElementById("hearts");

function createHeart(x,y,delay){
  const heart = document.createElementNS("http://www.w3.org/2000/svg","path");
  heart.setAttribute("d","M0,-6 C-6,-12 -18,-2 0,12 C18,-2 6,-12 0,-6 Z");
  heart.setAttribute("transform",`translate(${x},${y}) scale(1.2)`);
  heart.setAttribute("class","heart");
  heart.style.animationDelay = delay + "s";
  heart.style.animation += ", appear 1s forwards";
  heartGroup.appendChild(heart);
}

for(let i=0;i<25;i++){
  let x = 200 + (Math.random()*160 - 80);
  let y = 180 + Math.random()*80;
  createHeart(x,y,4 + Math.random()*2);
}

/* CONTADOR */
const fechaInicio = new Date("2022-08-22T00:00:00");

function calcularTiempo(){
  const ahora = new Date();

  let años = ahora.getFullYear() - fechaInicio.getFullYear();
  let meses = ahora.getMonth() - fechaInicio.getMonth();
  let dias = ahora.getDate() - fechaInicio.getDate();

  if(dias < 0){
    meses--;
    const ultimoMes = new Date(ahora.getFullYear(), ahora.getMonth(), 0).getDate();
    dias += ultimoMes;
  }

  if(meses < 0){
    años--;
    meses += 12;
  }

  document.getElementById("contador").innerHTML =
  `Llevamos ${años} años, ${meses} meses y ${dias} días juntos 💖`;
}

setInterval(calcularTiempo,1000);
calcularTiempo();
</script>

</body>
</html>
